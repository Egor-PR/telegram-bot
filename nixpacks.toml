[phases.setup]
commands = []

[phases.install]
commands = [
  "python3.11 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip setuptools wheel",
  "/opt/venv/bin/pip install -r requirements.txt"
]

[phases.start]
commands = [
  "/opt/venv/bin/python3 bot.py"
]

[python]
packages = ["python3.11", "python3.11-venv", "python3.11-distutils"]



